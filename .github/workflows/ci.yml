name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install Python dependencies
        run: python -m pip install -e ".[all]" pyinstaller pytest
      - name: Python compile and tests
        run: python -m py_compile engine/*.py && python -m pytest -q
      - name: Stage Linux sidecar
        run: |
          pyinstaller --clean --onefile --name nl2sql-engine engine/server.py
          mkdir -p desktop/src-tauri/binaries
          cp dist/nl2sql-engine desktop/src-tauri/binaries/nl2sql-engine-x86_64-unknown-linux-gnu
      - name: Frontend build
        working-directory: desktop
        run: npm ci && npm run build
      - name: Tauri compile check
        working-directory: desktop/src-tauri
        run: cargo check
